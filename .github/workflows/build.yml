name: Build, verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check Rider build policy
        run: python3 .github/scripts/test_rider_target.py
      - name: Free space on the disposable GitHub-hosted runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(sed -n 's/^version=//p' gradle.properties)"
          sh .github/scripts/changelog-entry.sh "${RELEASE_TAG#v}" > /dev/null
      - name: Test current Rider, build and verify the release ZIP
        run: ./gradlew check buildPlugin verifyPluginStructure verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-reports
          path: build/reports/pluginVerifier/
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sh .github/scripts/changelog-entry.sh "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "Code Story $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
