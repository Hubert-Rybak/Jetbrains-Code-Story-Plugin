name: Build, verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(sed -n 's/^version=//p' gradle.properties)"
          sh .github/scripts/changelog-entry.sh "${RELEASE_TAG#v}" > /dev/null
      - name: Build and test
        run: ./gradlew check buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        type: [IU, RD]
        version: ['2025.3', '2026.1', '2026.2', EAP]
    name: Verify ${{ matrix.type }} ${{ matrix.version }}
    steps:
      - name: Free space for IDE distributions
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Verify compatibility
        run: ./gradlew verifyPlugin -PverificationType=${{ matrix.type }} -PverificationVersion=${{ matrix.version }}
      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-${{ matrix.type }}-${{ matrix.version }}
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sh .github/scripts/changelog-entry.sh "${RELEASE_TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # A release created by hand from the tag already exists: attach the verified zip to it.
            gh release upload "$RELEASE_TAG" dist/*.zip --clobber
            gh release edit "$RELEASE_TAG" --title "Code Story $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "Code Story $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi
